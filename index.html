<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REAL MADRID — Dashboard</title>
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/glass.css" />
  <link rel="stylesheet" href="styles/player-page.css" />
</head>

<body>
  <main class="page">

    <header class="navbar">
      <div class="logo">Real Madrid</div>
    </header>

    <section class="hero">
      <div class="hero-copy">
        <div class="club-crest">
          <img src="assets/crest.png" alt="Real Madrid crest" class="crest-img" />
        </div>
        <div class="season-label">Season 2026/27</div>
        <div class="since-label">Since 1902</div>
      </div>

      <div class="hero-visual">
        <div class="visual-title">
          <span class="gold">HALA</span>
          MADRID
        </div>
      </div>
    </section>

    <section class="steps" id="widgets">
      <article class="step step-dark" id="slot-past"></article>
      <article class="step step-gold" id="slot-schedule"></article>
      <article class="step step-light" id="slot-squad"></article>
    </section>

  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
